map $uri $gamehub_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Cache-Control $gamehub_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # A missing asset must return 404, never the SPA HTML document.
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ~* \.(?:js|css|svg|png|ico|webmanifest|woff2?)$ {
        try_files $uri =404;
    }

    # HTML, the manifest and service workers revalidate on every online load.
    # Hashed Vite assets can be cached indefinitely.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
